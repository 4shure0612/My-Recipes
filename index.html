<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, viewport-fit=cover">
<meta name="theme-color" content="#c9366a">
<title>내 책 레시피 검색 · 요리책 8권</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg:#fdf4f7; --bg-top:#ffeaf2; --card:#ffffff;
    --ink:#332430; --ink2:#6c5561; --ink3:#856d7a;
    --line:#f4dbe5; --line-soft:#fae7ee;
    --accent:#c9366a; --accent-deep:#a92a58; --accent-2:#ef7fa4;
    --accent-soft:#fde9f0; --tint:#fffafc;
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(900px 300px at 50% -80px, var(--bg-top) 0%, rgba(255,234,242,0) 72%),
      var(--bg);
    background-repeat:no-repeat;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    font-size:16px; line-height:1.45;
    -webkit-text-size-adjust:100%;
    padding-bottom:env(safe-area-inset-bottom);
  }
  button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;}
  a{color:inherit;text-decoration:none;}

  /* ---------- header ---------- */
  .hero{
    display:flex;align-items:center;gap:8px;
    padding:calc(10px + env(safe-area-inset-top)) 14px 6px;
  }
  .topbar{
    position:sticky; top:0; z-index:30;
    background:rgba(253,244,247,.94);
    -webkit-backdrop-filter:saturate(1.2) blur(8px);
    backdrop-filter:saturate(1.2) blur(8px);
    border-bottom:1px solid var(--line);
    padding:8px 12px 6px;
  }
  .logo{font-size:22px;line-height:1;}
  .hero h1{font-size:16px;margin:0;font-weight:800;letter-spacing:-.02em;}
  .hero .sub{margin:1px 0 0;font-size:11.5px;color:var(--ink3);}
  .hero .grow{flex:1;min-width:0;}
  .reset-top{
    border:1px solid #f3c9d9;background:#fff;border-radius:999px;
    padding:6px 11px;font-size:12.5px;font-weight:700;color:var(--accent-deep);
    white-space:nowrap;
  }
  /* 검색 폼: 빈 박스 없이 기존 검색창 너비·간격이 그대로 유지된다 */
  .sform{display:block;margin:0;padding:0;border:0;}
  .searchbox{
    display:flex;align-items:center;gap:6px;
    background:#fff;border:1.5px solid var(--line);border-radius:14px;
    padding:0 10px;height:46px;
  }
  .searchbox:focus-within{border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-soft);}
  .searchbox .ico{font-size:15px;opacity:.8;}
  .searchbox input{
    flex:1;min-width:0;border:0;outline:0;background:transparent;
    font-size:16px;color:var(--ink);padding:8px 0;
  }
  .searchbox input::placeholder{color:#bb9dab;}
  .searchbox input::-webkit-search-cancel-button{display:none;}
  .xbtn{
    border:0;background:#f7e4ec;color:var(--ink2);border-radius:50%;
    width:24px;height:24px;line-height:1;font-size:12px;display:grid;place-items:center;
    padding:0;flex:0 0 auto;
  }
  .xbtn:active{background:#f1d5e0;}

  /* ---------- chips ---------- */
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .scrollx{
    display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;padding:2px 0 4px;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  .scrollx::-webkit-scrollbar{display:none;}
  .books{margin-top:7px;}
  .majors{margin-top:8px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;
    scrollbar-width:none;-ms-overflow-style:none;}
  .majors::-webkit-scrollbar{display:none;}
  .chip{
    border:1.5px solid var(--line);background:#fff;color:var(--ink2);
    border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;
    white-space:nowrap;display:inline-flex;align-items:center;gap:5px;
    transition:background .12s,border-color .12s,color .12s;
  }
  .chip .n{
    font-size:11.5px;font-weight:800;color:#7d5f6e;
    background:#fbeef3;border-radius:999px;padding:1px 6px;
  }
  .chip[aria-pressed="true"]{
    background:var(--accent);border-color:var(--accent);color:#fff;
  }
  .chip[aria-pressed="true"] .n{background:rgba(0,0,0,.17);color:#fff;}
  .chip.minor[aria-pressed="true"]{background:var(--accent-deep);border-color:var(--accent-deep);}
  .chip:active{transform:scale(.97);}

  /* ---------- ingredient panel ---------- */
  main{padding:12px 12px 40px;max-width:760px;margin:0 auto;}
  .panel{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:10px 12px 6px;margin-bottom:12px;
    box-shadow:0 2px 10px rgba(201,54,106,.04);
  }
  .panel-head{display:flex;align-items:center;gap:8px;}
  .panel-head h2{
    font-size:13.5px;margin:0;font-weight:800;color:var(--ink);
    letter-spacing:-.01em;
  }
  .panel-head .hint{font-size:11.5px;color:var(--ink3);flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .toggle{
    border:0;background:transparent;color:var(--accent-deep);font-size:12.5px;font-weight:700;
    padding:4px 2px;
  }
  #ingBody{margin-top:8px;}
  #ingBody.collapsed{display:none;}
  .searchbox.small{height:40px;border-radius:12px;background:var(--tint);}
  .searchbox.small input{font-size:15px;padding:6px 0;}
  .majors{margin-top:8px;}
  .minors{margin-top:6px;max-height:150px;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding-right:2px;}
  .minors.expanded{max-height:none;}
  .mgroup{margin:6px 0 2px;}
  .mgroup-head{
    font-size:11px;font-weight:800;color:var(--ink3);letter-spacing:.02em;
    margin:6px 0 5px;display:flex;align-items:center;gap:6px;
  }
  .mgroup-head:after{content:"";flex:1;height:1px;background:var(--line-soft);}
  .mgroup .chips{gap:5px;}
  .chip.minor{padding:5px 10px;font-size:12.5px;font-weight:600;background:var(--tint);}

  /* ---------- result bar ---------- */
  .resultbar{
    display:flex;align-items:baseline;gap:6px;padding:2px 2px 8px;
    font-size:13px;color:var(--ink2);flex-wrap:wrap;
    /* 키보드를 닫고 결과로 스크롤할 때 위 고정 헤더에 가리지 않도록 */
    scroll-margin-top:150px;
  }
  .resultbar strong{font-size:19px;color:var(--accent-deep);font-weight:800;letter-spacing:-.02em;}
  .resultbar .faint{font-size:12px;color:var(--ink3);}
  .resultbar .active{
    flex:1 1 100%;font-size:11.5px;color:var(--ink3);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  /* ---------- cards ---------- */
  .list{display:flex;flex-direction:column;gap:8px;}
  .card{
    display:block;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:11px 12px;
    box-shadow:0 2px 8px rgba(201,54,106,.045);
  }
  .card:active{background:#fff7fa;border-color:#efc6d6;}
  .card .row1{display:flex;align-items:flex-start;gap:8px;}
  .card .menu{
    font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.3;
    flex:1;min-width:0;word-break:keep-all;
  }
  .card .menu mark{background:#ffd9e5;color:#7c1738;border-radius:3px;padding:0 1px;}
  .card .go{color:#dfa3ba;font-size:14px;flex:0 0 auto;padding-top:2px;}
  .card .row2{
    display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:7px;
    font-size:12px;color:var(--ink2);
  }
  /* 종이책 전용 카드(온라인 상세 없음) */
  .card.static{
    border-left:3px solid #f8cbdc;padding-left:9px;
    background:linear-gradient(180deg,var(--tint) 0%,#ffffff 70%);
  }
  .card.static:active{background:#fff5f9;}
  .badge{
    font-size:11px;font-weight:800;border-radius:6px;
    padding:2.5px 6px;letter-spacing:-.01em;white-space:nowrap;
  }
  .b0{background:#f9d9e5;color:#98234d;}
  .b1{background:#fbe1d2;color:#93401f;}
  .b2{background:#eae1f9;color:#573490;}
  .b3{background:#d9efe6;color:#1c5c4b;}
  .b4{background:#dbeaf8;color:#275679;}
  .b5{background:#f3deee;color:#7a3065;}
  .b6{background:#e7eedb;color:#4a5f22;}
  .b7{background:#f6e8d4;color:#7a5215;}
  .tag{
    border:1px solid var(--line-soft);background:var(--tint);color:var(--ink2);
    border-radius:6px;padding:2px 6px;font-size:11.5px;font-weight:600;white-space:nowrap;
  }
  .ing{color:var(--ink2);font-size:12px;min-width:0;}
  .ing .sep{color:#d3a8bb;padding:0 3px;}
  .pg{color:var(--ink3);font-size:11.5px;font-weight:700;white-space:nowrap;}
  .pg.paper{
    background:var(--accent-soft);color:var(--accent-deep);
    border:1px solid #f7cddd;border-radius:6px;padding:2px 7px;
    font-size:11.5px;font-weight:800;letter-spacing:-.01em;
  }

  .more{display:flex;flex-direction:column;align-items:center;gap:6px;margin:16px 0 8px;}
  .more button{
    border:1.5px solid var(--accent-2);background:#fff;color:var(--accent-deep);
    border-radius:999px;padding:11px 22px;font-size:14px;font-weight:800;
  }
  .more button:active{background:var(--accent-soft);border-color:var(--accent);}
  .more p{margin:0;font-size:11.5px;color:var(--ink3);}

  .empty{
    background:#fff;border:1px dashed #efc6d6;border-radius:14px;
    padding:26px 18px;text-align:center;color:var(--ink2);font-size:14px;
  }
  .empty strong{display:block;font-size:15px;color:var(--ink);margin-bottom:4px;}
  .empty .tip{font-size:12px;color:var(--ink3);margin-top:10px;line-height:1.6;}

  .totop{
    position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));
    width:44px;height:44px;border-radius:50%;border:1px solid #f3c9d9;
    background:#fff;color:var(--accent-deep);font-size:18px;font-weight:800;
    box-shadow:0 4px 14px rgba(201,54,106,.16);z-index:40;
  }
  /* ---------- favorites (하트) ---------- */
  .favrow{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap;}
  .chip.fav{
    padding:5px 10px;font-size:12.5px;font-weight:800;
    color:var(--accent-deep);border-color:#f3c9d9;background:var(--tint);
  }
  .chip.fav .heart{width:14px;height:14px;flex:0 0 auto;display:block;}
  .chip.fav .heart path{fill:none;stroke:currentColor;stroke-width:2.1;stroke-linejoin:round;stroke-linecap:round;}
  .chip.fav .n{background:#fbe1e9;color:var(--accent-deep);}
  .chip.fav[aria-pressed="true"]{background:#e0234e;border-color:#e0234e;color:#fff;}
  .chip.fav[aria-pressed="true"] .heart path{fill:currentColor;}
  .chip.fav[aria-pressed="true"] .n{background:rgba(0,0,0,.2);color:#fff;}
  .favhint{font-size:11px;color:var(--ink3);white-space:nowrap;}

  .cardwrap{position:relative;}
  .cardwrap > .card{padding-right:54px;}
  .favbtn{
    position:absolute;top:3px;right:2px;bottom:3px;width:46px;
    display:flex;align-items:center;justify-content:center;padding:0;
    border:0;background:transparent;border-radius:14px;
    color:#c9879f;
    -webkit-appearance:none;appearance:none;
    transition:color .12s,background .12s;
  }
  .favbtn .hico{width:23px;height:23px;display:block;}
  .favbtn .hico path{
    fill:none;stroke:currentColor;stroke-width:1.8;
    stroke-linejoin:round;stroke-linecap:round;
  }
  .favbtn:active{background:#fdeef3;color:#e0234e;}
  .favbtn[aria-pressed="true"]{color:#e0234e;}
  .favbtn[aria-pressed="true"] .hico path{fill:currentColor;}
  @keyframes favpop{0%{transform:scale(1);}35%{transform:scale(1.28);}100%{transform:scale(1);}}
  .favbtn.pop .hico{animation:favpop .3s ease-out;}
  .favbtn:focus-visible{outline:2px solid var(--accent-2);outline-offset:-2px;}

  @media (min-width:620px){
    .hero{padding-left:20px;padding-right:20px;}
    .topbar{padding-left:20px;padding-right:20px;}
    main{padding-left:20px;padding-right:20px;}
    .minors{max-height:none;}
    .books{flex-wrap:wrap;overflow:visible;}
  }
</style>
</head>
<body>

<div class="hero">
  <span class="logo">🍳</span>
  <div class="grow">
    <h1>내 책 레시피 검색</h1>
    <p class="sub">내 요리책 8권 · <span id="totalAll">0</span>개 레시피</p>
  </div>
  <button type="button" id="resetTop" class="reset-top" hidden>초기화</button>
</div>

<header class="topbar">
  <form class="sform" id="qForm" role="search" autocomplete="off">
    <div class="searchbox">
      <span class="ico">🔍</span>
      <input id="q" type="search" enterkeyhint="search" placeholder="메뉴명 검색 (예: 갈비찜)" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="메뉴명 검색">
      <button type="button" id="qClear" class="xbtn" hidden aria-label="메뉴명 검색어 지우기">✕</button>
    </div>
  </form>
  <div class="scrollx books" id="bookChips" role="group" aria-label="도서 선택"></div>
  <div class="favrow">
    <button type="button" id="favChip" class="chip fav" aria-pressed="false" aria-label="즐겨찾기만 보기 (0개)">
      <svg class="heart" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      <span>즐겨찾기만 보기</span>
      <span class="n" id="favCount">0</span>
    </button>
    <span class="favhint" id="favHint">카드의 ♡를 눌러 담아 두세요</span>
  </div>
</header>

<main>
  <section class="panel">
    <div class="panel-head">
      <h2>주재료로 찾기</h2>
      <span class="hint" id="ingHint">대분류 → 세부 재료</span>
      <button type="button" class="toggle" id="ingToggle" aria-expanded="true">접기</button>
    </div>
    <div id="ingBody">
      <form class="sform" id="iqForm" role="search" autocomplete="off">
        <div class="searchbox small">
          <span class="ico">🥕</span>
          <input id="iq" type="search" enterkeyhint="search" placeholder="주재료 검색 (예: 두부, 오징어)" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="주재료 검색">
          <button type="button" id="iqClear" class="xbtn" hidden aria-label="주재료 검색어 지우기">✕</button>
        </div>
      </form>
      <div class="chips majors scrollx" id="majorChips" role="group" aria-label="주재료 대분류"></div>
      <div class="minors" id="minorWrap"></div>
    </div>
  </section>

  <div class="resultbar" id="summary">
    <strong id="count">0</strong><span>개</span>
    <span class="faint" id="countOf"></span>
    <span class="active" id="activeFilters"></span>
  </div>

  <div class="list" id="list"></div>
  <div class="more" id="moreWrap" hidden>
    <button type="button" id="moreBtn">더 보기</button>
    <p id="shownTxt"></p>
  </div>
  <div class="empty" id="empty" hidden>
    <strong>조건에 맞는 레시피가 없어요</strong>
    검색어를 줄이거나 다른 주재료를 골라 보세요.
    <div class="tip">팁: 메뉴명은 띄어쓰기 없이도 찾아요. 예) “갈비찜”, “김치찌개”<br>주재료는 대분류만 골라도 그 안의 모든 재료를 찾아드려요.</div>
  </div>

  <button type="button" id="toTop" class="totop" hidden aria-label="맨 위로">↑</button>

  var MAJORS = [];
  var MAJOR_MINORS = {};
  BASES.forEach(function(base){
    var cut = base.indexOf("-");
    var major = cut > 0 ? base.slice(0, cut) : base;
    var minor = cut > 0 ? base.slice(cut + 1) : base;
    if (!MAJOR_MINORS[major]){ MAJOR_MINORS[major] = []; MAJORS.push(major); }
    MAJOR_MINORS[major].push({base: base, minor: minor});
  });
  MAJORS.forEach(function(m){ state.majors[m] = true; });
  var MAJOR_COUNT = {}, MINOR_COUNT = {};
  RECIPES.forEach(function(r){
    MAJOR_COUNT[r.major] = (MAJOR_COUNT[r.major] || 0) + 1;
    MINOR_COUNT[r.base] = (MINOR_COUNT[r.base] || 0) + 1;
  });

  // ---- dom ----
  var $ = function(id){ return document.getElementById(id); };
  var elQ = $("q"), elQC = $("qClear");
  var elIQ = $("iq"), elIQC = $("iqClear");
  var elBook = $("bookChips"), elMajor = $("majorChips"), elMinor = $("minorWrap");
  var elCount = $("count"), elCountOf = $("countOf"), elActive = $("activeFilters");
  var elList = $("list"), elMore = $("moreWrap"), elMoreBtn = $("moreBtn"), elShown = $("shownTxt");
  var elEmpty = $("empty"), elReset = $("resetTop"), elToTop = $("toTop");
  var elIngBody = $("ingBody"), elIngToggle = $("ingToggle");
  var elFavChip = $("favChip"), elFavCount = $("favCount"), elFavHint = $("favHint");
  var elQForm = $("qForm"), elIQForm = $("iqForm"), elSummary = $("summary");
  var EMPTY_DEFAULT = elEmpty ? elEmpty.innerHTML : "";
  $("totalAll").textContent = RECIPES.length;

  // ---- build chips ----
  function chip(label, count, pressed, onTap, cls){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (cls ? " " + cls : "");
    b.setAttribute("aria-pressed", pressed ? "true" : "false");
    b.appendChild(document.createTextNode(label));
    if (count != null){
      var s = document.createElement("span");
      s.className = "n";
      s.textContent = String(count);
      b.appendChild(s);
    }
    b.addEventListener("click", onTap);
    return b;
  }

  function bookSelectedCount(){
    return BOOKS.filter(function(b, i){ return state.books[i]; }).length;
  }

  function renderBooks(){
    elBook.innerHTML = "";
    var allOn = bookSelectedCount() === BOOKS.length;
    elBook.appendChild(chip("전체 " + BOOKS.length + "권", RECIPES.length, allOn, function(){
      BOOKS.forEach(function(b, i){ state.books[i] = true; });
      renderBooks(); apply();
    }));
    BOOKS.forEach(function(b, i){
      elBook.appendChild(chip(b.short, DATA.counts[i], !!state.books[i], function(){
        var allOn = bookSelectedCount() === BOOKS.length;
        if (allOn){                       // 전체 → 이 책만
          BOOKS.forEach(function(bb, j){ state.books[j] = (j === i); });
        } else {
          state.books[i] = !state.books[i];
          // 모두 꺼지면 전체로 복귀
          if (bookSelectedCount() === 0) BOOKS.forEach(function(bb, j){ state.books[j] = true; });
        }
        renderBooks(); apply();
      }));
    });
  }

  function majorAllOn(){
    return MAJORS.every(function(m){ return state.majors[m]; });
  }

  function renderMajors(){
    elMajor.innerHTML = "";
    var noMinor = Object.keys(state.minors).length === 0;
    elMajor.appendChild(chip("전체 재료", RECIPES.length, noMinor && majorAllOn(), function(){
      MAJORS.forEach(function(m){ state.majors[m] = true; });
      state.minors = {};
      renderMajors(); renderMinors(); apply();
    }));
    var allOn2 = majorAllOn();
    MAJORS.forEach(function(m){
      elMajor.appendChild(chip(m, MAJOR_COUNT[m] || 0, !!state.majors[m], function(){
        if (allOn2){                        // 전체 → 이 대분류만
          MAJORS.forEach(function(x){
            state.majors[x] = (x === m);
            if (x !== m) MAJOR_MINORS[x].forEach(function(y){ delete state.minors[y.base]; });
          });
        } else if (state.majors[m]){
          state.majors[m] = false;
          MAJOR_MINORS[m].forEach(function(y){ delete state.minors[y.base]; });
          if (!MAJORS.some(function(x){ return state.majors[x]; })){
            MAJORS.forEach(function(x){ state.majors[x] = true; });
          }
        } else {
          state.majors[m] = true;
        }
        renderMajors(); renderMinors(); apply();
      }));
    });
  }

  function renderMinors(){
    elMinor.innerHTML = "";
    MAJORS.forEach(function(m){
      if (!state.majors[m]) return;
      var g = document.createElement("div");
      g.className = "mgroup";
      var h = document.createElement("div");
      h.className = "mgroup-head";
      h.textContent = m;
      g.appendChild(h);
      var wrap = document.createElement("div");
      wrap.className = "chips";
      MAJOR_MINORS[m].forEach(function(x){
        wrap.appendChild(chip(x.minor, MINOR_COUNT[x.base] || 0, !!state.minors[x.base], function(){
          if (state.minors[x.base]) delete state.minors[x.base];
          else state.minors[x.base] = true;
          renderMajors(); renderMinors(); apply();
        }, "minor"));
      });
      g.appendChild(wrap);
      elMinor.appendChild(g);
    });
  }

  // ---- filtering ----
  var qTok = [], iqTok = [];
  var minorKeys = [], majorKeys = [];

  function compute(){
    var out = [];
    var bookOn = BOOKS.map(function(b, i){ return !!state.books[i]; });
    var anyBook = bookOn.some(Boolean);
    // 대분류별로 고른 세부 재료: 고른 게 있으면 그 대분류는 세부 재료로만 좁힌다
    var minorByMajor = {};
    minorKeys.forEach(function(b){
      var cut = b.indexOf("-");
      var mj = cut > 0 ? b.slice(0, cut) : b;
      (minorByMajor[mj] = minorByMajor[mj] || {})[b] = true;
    });
    for (var i = 0; i < RECIPES.length; i++){
      var r = RECIPES[i];
      if (state.fav && !FAVS[favKey(r)]) continue;
      if (anyBook && !bookOn[r.book]) continue;
      var only = minorByMajor[r.major];
      if (only){
        if (!only[r.base]) continue;
      } else if (!state.majors[r.major]){
        continue;
      }
      if (qTok.length && !hashTokens(r.menuN, qTok)) continue;
      if (iqTok.length && !hashTokens(r.ingN, iqTok)) continue;
      out.push(r);
    }
    return out;
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  function highlight(text){
    if (!qTok.length) return esc(text);
    // 공백을 허용한 패턴으로 원문에서 강조
    var parts = String(state.q).trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return esc(text);
    var pattern = parts.map(function(p){
      return p.split("").map(function(ch){
        return esc(ch).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      }).join("\\s*");
    }).join("|");
    try{
      var re = new RegExp("(" + pattern + ")", "gi");
      return esc(text).replace(re, "<mark>$1</mark>");
    }catch(e){
      return esc(text);
    }
  }

  var filtered = [], shown = 0;

  function cardHTML(r){
    var b = BOOKS[r.book];
    var linked = !!b.link;
    var serv = r.serv ? '<span class="tag">' + esc(r.serv) + "</span>" : "";
    var page = "";
    if (r.page){
      page = linked
        ? '<span class="pg">' + esc(r.page) + "쪽</span>"
        : '<span class="pg paper">종이책 p.' + esc(r.page) + "</span>";
    }
    var inner =
        '<div class="row1"><span class="menu">' + highlight(r.menu) + "</span>"
      + (linked ? '<span class="go">↗</span>' : "")
      + "</div>"
      + '<div class="row2">'
      + '<span class="badge ' + b.cls + '">' + esc(b.short) + "</span>"
      + '<span class="tag">' + esc(r.kind) + "</span>"
      + '<span class="ing">' + esc(r.major) + '<span class="sep">›</span>' + esc(r.minor) + "</span>"
      + serv + page
      + "</div>";
    var key = favKey(r);
    var on = !!FAVS[key];
    var favBtn =
        '<button type="button" class="favbtn" data-fav="' + key + '"'
      + ' aria-pressed="' + (on ? "true" : "false") + '"'
      + ' aria-label="' + (on ? "즐겨찾기에서 빼기" : "즐겨찾기에 담기") + '"'
      + ' title="' + (on ? "즐겨찾기에서 빼기" : "즐겨찾기에 담기") + '">'
      + '<svg class="hico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>'
      + "</button>";
    if (!linked){
      // 온라인 상세가 없는 종이책: 링크 없이 쪽수만 강조한 카드
      return '<div class="cardwrap"><div class="card static">' + inner + "</div>" + favBtn + "</div>";
    }
    return '<div class="cardwrap"><a class="card" href="' + VIEW_URL + r.idx + '&tbname=search" target="_blank" rel="noopener noreferrer">'
      + inner + "</a>" + favBtn + "</div>";
  }

  function renderList(reset){
    if (reset) shown = 0;
    var target = Math.min(shown + PAGE_SIZE, filtered.length);
    var html = "";
    for (var i = shown; i < target; i++) html += cardHTML(filtered[i]);
    if (reset) elList.innerHTML = html;
    else elList.insertAdjacentHTML("beforeend", html);
    shown = target;
    var rest = filtered.length - shown;
    elMore.hidden = rest <= 0;
    if (rest > 0){
      elMoreBtn.textContent = "더 보기 (" + Math.min(PAGE_SIZE, rest) + "개)";
      elShown.textContent = shown + " / " + filtered.length + "개 표시 중";
    }
    elEmpty.hidden = filtered.length !== 0;
    if (!elEmpty.hidden) updateEmpty();
  }

  function updateEmpty(){
    if (!elEmpty) return;
    if (state.fav && favCount() === 0){
      elEmpty.innerHTML = '<strong>아직 찜한 레시피가 없어요</strong>'
        + '마음에 드는 레시피 카드 오른쪽의 ♡를 누르면 여기에 모여요.'
        + '<div class="tip">찜한 레시피는 이 기기에 저장되어 페이지를 다시 열어도 그대로 남아 있어요.</div>';
      return;
    }
    if (state.fav){
      elEmpty.innerHTML = '<strong>찜한 레시피 중에 조건에 맞는 게 없어요</strong>'
        + '검색어를 줄이거나 다른 주재료를 골라 보세요.'
        + '<div class="tip">찜한 레시피는 ' + favCount() + '개예요. 위의 “즐겨찾기만 보기”를 다시 누르면 전체 레시피에서 찾아요.</div>';
      return;
    }
    elEmpty.innerHTML = EMPTY_DEFAULT;
  }

  // ---- favorites UI ----
  function paintFav(btn, on){
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.setAttribute("aria-label", on ? "즐겨찾기에서 빼기" : "즐겨찾기에 담기");
    btn.setAttribute("title", on ? "즐겨찾기에서 빼기" : "즐겨찾기에 담기");
  }

  function renderFavChip(){
    if (!elFavChip) return;
    var n = favCount();
    var on = !!state.fav;
    elFavChip.setAttribute("aria-pressed", on ? "true" : "false");
    elFavChip.setAttribute("aria-label", "즐겨찾기만 보기 (" + n + "개)");
    if (elFavCount) elFavCount.textContent = String(n);
    if (elFavHint) elFavHint.textContent = n ? "찜한 레시피 " + n + "개" : "카드의 ♡를 눌러 담아 두세요";
  }

  function toggleFav(key, btn){
    if (!key) return;
    if (FAVS[key]) delete FAVS[key];
    else FAVS[key] = true;
    saveFavs();
    var on = !!FAVS[key];
    renderFavChip();
    if (state.fav){
      apply();                 // 즐겨찾기만 보기 중에는 목록에서 빠진다
      return;
    }
    if (btn) paintFav(btn, on);
    var btns = elList.querySelectorAll(".favbtn");
    for (var i = 0; i < btns.length; i++){
      if (btns[i].getAttribute("data-fav") === key) paintFav(btns[i], on);
    }
  }

  function activeSummary(){
    var bits = [];
    var bc = bookSelectedCount();
    if (bc && bc < BOOKS.length){
      bits.push(BOOKS.filter(function(b, i){ return state.books[i]; })
        .map(function(b){ return b.short; }).join("·"));
    }
    if (minorKeys.length){
      bits.push(minorKeys.map(function(base){
        var cut = base.indexOf("-");
        return cut > 0 ? base.slice(cut + 1) : base;
      }).join("·"));
    }
    if (majorKeys.length && majorKeys.length < MAJORS.length){
      var withMinor = {};
      minorKeys.forEach(function(base){
        var cut = base.indexOf("-");
        withMinor[cut > 0 ? base.slice(0, cut) : base] = true;
      });
      var only = majorKeys.filter(function(m){ return !withMinor[m]; });
      if (only.length) bits.push(only.join("·"));
    }
    if (state.fav) bits.push("❤️ 즐겨찾기만");
    if (state.iq.trim()) bits.push("재료 “" + state.iq.trim() + "”");
    if (state.q.trim()) bits.push("메뉴 “" + state.q.trim() + "”");
    elActive.textContent = bits.length ? "필터: " + bits.join(" + ") : "";
    elReset.hidden = bits.length === 0;
  }

  function apply(){
    qTok = tokens(state.q);
    iqTok = tokens(state.iq);
    minorKeys = Object.keys(state.minors);
    majorKeys = Object.keys(state.majors).filter(function(m){ return state.majors[m]; });
    if (majorKeys.length === MAJORS.length) majorKeys = [];
    filtered = compute();
    elCount.textContent = String(filtered.length);
    elCountOf.textContent = filtered.length === RECIPES.length ? "" : "/ 전체 " + RECIPES.length + "개";
    activeSummary();
    renderFavChip();
    renderList(true);
  }

  // ---- events ----

  // 결과 요약줄(#summary)이 화면에 보이도록 스크롤한다.
  // 위 고정 헤더(.topbar) 높이를 재서 그 아래로 붙인다.
  function topbarBottom(){
    var tb = document.querySelector(".topbar");
    if (!tb || !tb.getBoundingClientRect) return 0;
    var r = tb.getBoundingClientRect();
    // 스크롤하면 헤더가 위에 붙으므로, 실제로 가리는 높이는 자기 높이와 화면 위쪽 끝 중 작은 값
    var h = Math.min(r.bottom, r.height || 0);
    return h > 0 ? h : 0;
  }
  function revealResults(){
    if (!elSummary) return;
    setTimeout(function(){
      var box = null;
      try { box = elSummary.getBoundingClientRect(); } catch(e){ return; }
      if (!box) return;
      var off = Math.round(topbarBottom()) + 8;
      var vh = window.innerHeight || document.documentElement.clientHeight || 0;
      if (box.top >= off && box.bottom <= vh) return;      // 이미 보이면 그대로 둔다
      if (elSummary.style) elSummary.style.scrollMarginTop = off + "px";
      try {
        elSummary.scrollIntoView({ block: "start", behavior: "smooth" });
      } catch(e){
        try { elSummary.scrollIntoView(true); } catch(e2){}
      }
    }, 90);                              // 키보드가 내려간 뒤 배치가 잡힐 시간
  }

  function bindSearch(input, clearBtn, key, form, opts){
    opts = opts || {};
    var reveal = !!opts.reveal;

    function sync(){
      state[key] = input.value;
      clearBtn.hidden = input.value.length === 0;
    }

    // 돋보기(검색) 키 처리: 조합을 확정하고 키보드를 닫은 뒤 결과를 보여준다
    function finish(){
      try { input.blur(); } catch(e){}     // 모바일 가상 키보드 닫기
      sync();
      apply();
      if (reveal) revealResults();
      // 조합 확정(compositionend)이 blur 뒤에 도착하는 경우까지 쫓아간다
      setTimeout(function(){
        var before = state[key];
        sync();
        if (state[key] !== before) apply();
      }, 0);
    }

    input.addEventListener("input", function(){
      sync();
      apply();
    });

    clearBtn.addEventListener("click", function(){
      input.value = "";
      state[key] = "";
      clearBtn.hidden = true;
      apply();
      input.focus();                        // 다시 검색하려고 터치했을 때와 같이 포커스·키보드 복귀
    });

    // 한글 조합 중에도 결과가 즉시 갱신되도록
    input.addEventListener("compositionend", function(){
      sync();
      apply();
    });

    // 키보드가 닫힐 때 조합이 확정된 값을 반영
    input.addEventListener("blur", function(){
      var before = state[key];
      sync();
      if (state[key] !== before) apply();
      clearBtn.hidden = input.value.length === 0;
    });

    // 안드로이드 키보드의 돋보기(검색) 키 → form submit
    if (form){
      form.addEventListener("submit", function(e){
        if (e && e.preventDefault) e.preventDefault();
        finish();
      });
    }

    input.addEventListener("keydown", function(e){
      var isEnter = e.key === "Enter" || e.keyCode === 13 || e.which === 13;
      if (!isEnter) return;
      if (e.isComposing || e.keyCode === 229){
        // 삼성 키보드 한글 조합 중: preventDefault 로 조합을 끊지 않고,
        // 조합이 확정된 다음 값으로 검색·blur 한다.
        setTimeout(finish, 0);
        return;
      }
      e.preventDefault();
      finish();
    });
  }
  bindSearch(elQ, elQC, "q", elQForm, { reveal: true });
  bindSearch(elIQ, elIQC, "iq", elIQForm, { reveal: false });

  elIngToggle.addEventListener("click", function(){
    var collapsed = elIngBody.classList.toggle("collapsed");
    elIngToggle.textContent = collapsed ? "펼치기" : "접기";
    elIngToggle.setAttribute("aria-expanded", collapsed ? "false" : "true");
  });

  elMoreBtn.addEventListener("click", function(){ renderList(false); });

  // ---- favorites events ----
  if (elFavChip){
    elFavChip.addEventListener("click", function(){
      state.fav = !state.fav;
      apply();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  }

  elList.addEventListener("click", function(ev){
    var t = ev.target, btn = null;
    while (t && t !== elList){
      if (t.className && typeof t.className === "string" && t.className.indexOf("favbtn") >= 0){
        btn = t; break;
      }
      t = t.parentNode;
    }
    if (!btn) return;
    ev.preventDefault();
    ev.stopPropagation();
    var key = btn.getAttribute("data-fav");
    toggleFav(key, btn);
    btn.classList.remove("pop");
    void btn.offsetWidth;      // 애니메이션 재시작
    btn.classList.add("pop");
  });

  elList.addEventListener("animationend", function(ev){
    var t = ev.target;
    if (t && t.classList && t.classList.contains("hico") && t.parentNode && t.parentNode.classList){
      t.parentNode.classList.remove("pop");
    }
  });

  elReset.addEventListener("click", function(){
    BOOKS.forEach(function(b, i){ state.books[i] = true; });
    MAJORS.forEach(function(m){ state.majors[m] = true; });
    state.minors = {};
    state.q = ""; state.iq = "";
    state.fav = false;
    elQ.value = ""; elIQ.value = "";
    elQC.hidden = true; elIQC.hidden = true;
    renderBooks(); renderMajors(); renderMinors(); apply();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  var ticking = false;
  window.addEventListener("scroll", function(){
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      elToTop.hidden = window.scrollY < 500;
      ticking = false;
    });
  }, { passive: true });
  elToTop.addEventListener("click", function(){
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  // ---- boot ----
  loadFavs();
  renderFavChip();
  renderBooks();
  renderMajors();
  renderMinors();
  apply();
})();
</script>
</body>
</html>
